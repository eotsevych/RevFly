[package]
name = "revfly"
version = "0.1.12"
description = "RevFly Desktop Assistant"
authors = ["RevFly Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
silero-vad-crs = "0.4.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.33", features = ["bundled"] }
rfd = "0.17"
futures-util = "0.3"
arboard = "3"
enigo = "0.3"
dirs = "6.0"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
parakeet-rs = "0.3"
base64 = "0.22"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
regex = "1"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
nnnoiseless = { version = "0.5.2", default-features = false }
rubato = "1.0.1"
audioadapter-buffers = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "custom-protocol", "devtools", "image-png"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "custom-protocol", "devtools", "image-png"] }
whisper-rs = { version = "0.16.0" }
