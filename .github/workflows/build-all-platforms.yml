name: Build RevFly (All Platforms)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Universal, Apple Silicon & Intel)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build macOS App
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_universal.sh

      - name: Upload macOS Installers
        uses: actions/upload-artifact@v4
        with:
          name: revfly-macos-installers
          path: |
            ~/Desktop/RevFly_Installers/*.dmg
            installers/*.dmg

  build-windows:
    name: Build Windows (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build Windows App (.exe and .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: 'RevFly v__VERSION__'
          releaseBody: 'Windows Build'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: revfly-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/revfly.exe

  build-linux:
    name: Build Linux (.AppImage & .deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Build Linux App (.AppImage and .deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: 'RevFly v__VERSION__'
          releaseBody: 'Linux Build'
          releaseDraft: true
          prerelease: false

      - name: Upload Linux Installers
        uses: actions/upload-artifact@v4
        with:
          name: revfly-linux-installer
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/revfly
